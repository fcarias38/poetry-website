    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #0d0d0d
          url("images/jessica-christian-wuqYCTAYPH4-unsplash.jpg") no-repeat
          center center/cover;
        font-family: "Merriweather", serif;
        text-align: center;
        color: #f8f1e7;
        margin: 0;
        position: relative;
        overflow: hidden;
        animation: zoomBackground 30s ease-in-out infinite alternate;
      }
      @keyframes zoomBackground {
        from {
          background-size: 100%;
        }
        to {
          background-size: 110%;
        }
      }
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 0;
      }
      .content {
        max-width: 700px;
        padding: 40px;
        position: relative;
        z-index: 1;
        animation: fadeInContent 2s ease-in;
      }
      h1 {
        font-size: 2.8rem;
        margin-bottom: 1rem;
        font-weight: normal;
        animation: fadeInTitle 2s ease-in forwards;
        opacity: 0;
      }
      p {
        font-size: 1.3rem;
        margin-bottom: 2rem;
        font-style: italic;
        animation: fadeInQuote 3s ease-in forwards;
        opacity: 0;
        animation-delay: 1s;
      }
      .btn-outline-light {
        font-size: 1rem;
        padding: 0.6rem 2.5rem;
        border-radius: 30px;
        animation: fadeInButton 4s ease-in forwards;
        opacity: 0;
        animation-delay: 2s;
      }
      footer {
        position: absolute;
        bottom: 10px;
        width: 100%;
        text-align: center;
        font-size: 0.8rem;
        color: #aaa;
      }
      @keyframes fadeInContent {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fadeInTitle {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeInQuote {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeInButton {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>

        must be to burn in its flames"
